name: Development CI

on:
  push:
    branches:
      - 'features/**'
      - dev
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'deployment.yml'
  pull_request:
    branches:
      - 'features/**'
    types:
      - opened
      - reopened
      - synchronize

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout Code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Python Environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Step 3: Install Dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black  # Install linting tools

      # Step 4: Run Linting (Flake8)
      - name: Run Flake8 for linting
        run: flake8 . --count --show-source --statistics --max-line-length=120

      # Step 5: Run Code Formatting Check (Black)
      - name: Run Black for formatting check
        run: black . --check



  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      # Step 2: Set up Python Environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Step 3: Install Dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run Tests (if you have any)
      # - name: Run tests
      #   run: pytest || echo "No tests available, skipping."

  deploy:
      runs-on: ubuntu-latest

      steps:
        # Step 1: Check out the code
        - name: Checkout code
          uses: actions/checkout@v3

        # Step 2: Set up OpenShift CLI
        - name: Install OpenShift CLI
          run: |
            curl -L https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz | tar -xz -C /usr/local/bin
            oc version

        # Step 3: Log in to OpenShift
        - name: Log in to OpenShift
          run: |
            oc login --token=${{ secrets.OPENSHIFT_TOKEN }} --server=${{ secrets.OPENSHIFT_SERVER }}

        # Step 4: Switch to the target namespace/project
        - name: Switch namespace
          run: |
            oc project oscar-dev

        # Step 5: Build and Push Docker Image
        - name: Build and push Docker image
          run: |
            docker build -t earlybirdreal/sail-faq-api:latest .
            echo "${{ secrets.DOCKER_TOKEN }}" | docker login --username ${{ secrets.DOCKER_ID }} --password-stdin
            docker push earlybirdreal/sail-faq-api:latest

        # Step 6: Deploy to OpenShift
        - name: Apply deployment configuration
          run: |
            oc apply -f openshift/deployment.yml
