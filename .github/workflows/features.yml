name: Development CI

on:
  push:
    branches:
      - 'features/**'
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'deployment.yml'
  pull_request:
    branches:
      - 'features/**'
    types:
      - opened
      - reopened
      - synchronize

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout Code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Python Environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Step 3: Install Dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black  # Install linting tools

      # Step 4: Run Linting (Flake8)
      - name: Run Flake8 for linting
        run: flake8 . --count --show-source --statistics --max-line-length=120

      # Step 5: Run Code Formatting Check (Black)
      - name: Run Black for formatting check
        run: black . --check



  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      # Step 2: Set up Python Environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Step 3: Install Dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run Tests
      - name: Run tests
        run: pytest || echo "No tests available, skipping."
