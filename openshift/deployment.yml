apiVersion: apps/v1
kind: Deployment
metadata:
  name: sail-faq-api
  namespace: oscar-dev
  labels:
    app: sail-faq-api
spec:
  replicas: 1  # Single instance
  selector:
    matchLabels:
      app: sail-faq-api
  template:
    metadata:
      labels:
        app: sail-faq-api
    spec:
      containers:
        - name: sail-faq-api
          image: earlybirdreal/sail-faq-api:latest
          env:
            - name: FAQ_AZURE_CONN_STRING
              valueFrom:
                secretKeyRef:
                  name: faq-azure-storage-secret
                  key: FAQ_AZURE_CONN_STRING
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "0.49"
              memory: "499Mi"
            requests:
              cpu: "0.2"
              memory: "50Mi"
      imagePullSecrets:
      - name: regcred

---
apiVersion: v1
kind: Service
metadata:
  name: sail-faq-api-service
  namespace: oscar-dev
spec:
  selector:
    app: sail-faq-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sail-faq-api-route
  namespace: oscar-dev
spec:
  to:
    kind: Service
    name: sail-faq-api-service
  port:
    targetPort: 8080
  tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect